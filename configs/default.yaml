# MINOTAUR Default Configuration
# Minimal configuration with sensible defaults

task_type: "binary"
experiment_name: "default_experiment"
description: "Default MINOTAUR configuration"
random_seed: 42

data:
  db_path: "${DB_PATH}"  # Use environment variable
  database: "lmdb"
  target: "Survival"
  bag_n: 3000
  k: 0
  test_size: 0.2
  stratify_random_state: 42
  k_fold: 8
  k_fold_random_state: 1

concepts:
  cpt_ids: ["Stage", "Age", "Cancer", "RNA_Bio_ter"]
  n_concepts: 4
  concept_states: [4, 3, 10, 3]
  cpt_cls_weights: null
  no_concepts: false

model:
  n_tasks: 1
  h_dim: 1024
  emb_dim: 8
  emb_activ: "LeakyReLU"
  pre: true
  pre_bn_mlp: true
  attn: true
  n_attn_heads: 4
  attn_dim: 256
  attn_dropout: 0.3
  dropout: true
  c_weight: 1.0
  task_loss_weight: 1.0

training:
  optimizer: "adam"
  learning_rate: 0.001
  momentum: 0.9
  weight_decay: 0.00004
  max_epochs: 7
  check_val_every_n_epoch: 7
  batch_size: 64
  val_batch_size: 4
  num_workers: null
  drop_last: true

output:
  save_path: null
  log_path: null
  name: "default_experiment"
  categorical: true

hardware:
  accelerator: "gpu"
  devices: "auto"
  enable_progress_bar: true
  cuda_launch_blocking: false


