# MINOTAUR Configuration: Categorical Concepts
# Based on arg_def_cat.py defaults

task_type: "binary"  # 'binary', 'multiclass', 'continuous', or 'cox'
experiment_name: "cat_model_exv18"
description: "CEM-MIL with categorical concepts"
random_seed: 42

data:
  db_path: "${DB_PATH}"  # Use environment variable or full path
  database: "lmdb"
  target: "Survival"
  bag_n: 3000
  k: 0
  test_size: 0.2
  stratify_random_state: 42
  k_fold: 8
  k_fold_random_state: 1

concepts:
  cpt_ids: ["Stage", "Age", "Cancer", "RNA_Bio_ter"]
  n_concepts: 4
  concept_states: [4, 3, 10, 3]  # Stage: 4 classes, Age: 3 classes, Cancer: 10 classes, RNA_Bio_ter: 3 classes
  cpt_cls_weights: null  # Will be computed automatically if null
  no_concepts: false

model:
  n_tasks: 1
  h_dim: 1024
  emb_dim: 8
  emb_activ: "LeakyReLU"
  pre: true
  pre_bn_mlp: true
  attn: true
  n_attn_heads: 4
  attn_dim: 256
  attn_dropout: 0.3
  dropout: true  # Can be true/false or a float value
  c_weight: 1.0
  task_loss_weight: 1.0
  shared_prob_gen: false
  c2y_model: null
  c2y_layers: null
  top_k_accuracy: null

training:
  optimizer: "adam"
  learning_rate: 0.001
  momentum: 0.9
  weight_decay: 0.00004
  max_epochs: 7
  check_val_every_n_epoch: 7
  batch_size: 64
  val_batch_size: 4
  num_workers: null  # null = auto (cpu_count()/6)
  drop_last: true

  hyperparameter_search:
    n_bags: [3000]              # Different bag sizes to try
    batches: [64]                # Different batch sizes  
    cpt_weights: [10]  # Concept loss weights
    emb_sizes: [8]               # Embedding dimensions
    dropouts: [0.3]              # Dropout rates
    attns: [true]                # Use attention or not
    n_repeats: 1    

output:
  save_path: null  # Set at runtime
  log_path: null  # Will be set to save_path/logs if null
  name: "cat_model_exv18"
  categorical: true

hardware:
  accelerator: "gpu"
  devices: "auto"
  enable_progress_bar: true
  cuda_launch_blocking: false


